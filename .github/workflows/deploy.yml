name: KRO-Worker Deployment

on:
    push:
        branches:
            - main
    release:
        types: [published]

jobs:
    build:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4
              with:
                ref: main
                fetch-depth: 0

            - name: Copy .env.app
              run: |
                echo "${{ secrets.ENV_PROD }}" >> .env
            
            - name: Add Website
              uses: actions/checkout@v4
              with:
                repository: Mittelblut9/KRO-website
                ref: main
                path: KRO-website
            - name: Copy env
              run: |
                cp .env KRO-website/.env

            - name: Stop all docker
              run: |
                docker compose -f .prod/docker-compose.prod.yml down --remove-orphans

            - name: Start all docker
              run: |
                export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                export POSTGRES_DATABASE=${{ secrets.POSTGRES_DATABASE }}
                docker compose -f .prod/docker-compose.prod.yml build app
                docker compose -f .prod/docker-compose.prod.yml up -d